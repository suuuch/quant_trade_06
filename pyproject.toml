[project]
name = "quant-trade-06"
version = "0.1.0"
description = "A-share quantitative trading strategy — M-top short / W-bottom long / RSI trend following"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "qq-botpy>=1.2.1",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_trade"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]
exclude = [".venv", "scripts"]
